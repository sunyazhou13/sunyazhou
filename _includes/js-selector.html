{% if page.layout == 'home' %}

  <script defer src="{{ '/assets/js/home.min.js' | relative_url }}"></script>

{% elsif page.layout == 'post' %}

  <script async src="{{ '/assets/js/post.min.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/code-copy.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/AISource/jekyll-tabs/tabs.js' | relative_url }}"></script>
  <script src="{{ '/assets/AISource/glightbox/glightbox.min.js' | relative_url }}"></script>

  {% if page.math %}
    <!-- MathJax -->
    <script src="{{ '/assets/js/data/mathjax.js' | relative_url }}"></script>
    <script id="MathJax-script" async src="{{ '/assets/AISource/mathjax/tex-mml-chtml.js' | relative_url }}"></script>
  {% endif %}

  {% if page.mermaid %}
    <!-- Mermaid -->
    <script src="{{ '/assets/AISource/mermaid/mermaid.min.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/mermaid-loader.js' | relative_url }}"></script>
  {% endif %}

{% elsif page.layout == 'page' %}

  {% if page.type == 'categories' %}
    <script async src="{{ '/assets/js/categories.min.js' | relative_url }}"></script>
  {% else %}
    <script async src="{{ '/assets/js/page.min.js' | relative_url }}"></script>
  {% endif %}
  <script defer src="{{ '/assets/js/code-copy.js' | relative_url }}"></script>
  <script src="{{ '/assets/AISource/glightbox/glightbox.min.js' | relative_url }}"></script>

  {% if page.mermaid %}
    <!-- Mermaid -->
    <script src="{{ '/assets/AISource/mermaid/mermaid.min.js' | relative_url }}"></script>
    <script defer src="{{ '/assets/js/mermaid-loader.js' | relative_url }}"></script>
  {% endif %}

{% else %}

  <script async src="{{ '/assets/js/page.min.js' | relative_url }}"></script>

{% endif %}
