# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
#--------------------------

title: 迈腾大队长

tagline: 外来务工人员mark一下
description: >-
    嗨,我是孙亚洲(@sunyazhou13),一名来自祖国北国冰城的iOS开发者.
url: 'https://www.sunyazhou.com'
author: 孙亚洲
avatar: /assets/images/avatar.jpg
logo: /assets/images/avatar.jpg

github:
  username: sunyazhou13

# twitter:
#   username: sunyazhou

social:
  name: sunyazhou
  email: sunyazhou@111.com
  links:
    - https://github.com/sunyazhou13
    # - https://twitter.com/sunyazhou13

lang: zh-Hans

# jekyll-polyglot 多语言配置 › https://github.com/untra/polyglot
languages: ["zh", "en"]
default_lang: "zh"
lang_from_path: true
parallel_localization: true
exclude_from_localization: ["assets", "javascript", "images", "css", "public", "sitemap.xml", "feed.xml", "robots.txt", "404.html"]

# jekyll-compose 新建文章默认 front matter（bundle exec jekyll post 自动注入）
jekyll_compose:
  default_front_matter:
    posts:
      categories: [iOS]
      tags: []
      typora-root-url: ..
      math: true
      mermaid: true

google_site_verification: Xo29j227HYVdC-vDA_-qJwvDP3PIo-lC78CFeBvhrDA #已经通过http://www.google.com/webmasters/tools/，将自己网站添加进 google网站管理，有利于googlegoogle的收录。

# Google Analytics (GA4)
google_analytics:
  id: G-72CBVB74WB

#--------------------------


# Only if your site type is GitHub Project sites and doesn't have a custom domain,
# change below value to '/projectname'.
baseurl: ''

# Change to your timezone › http://www.timezoneconverter.com/cgi-bin/findzone/findzone
timezone: Asia/Beijing

disqus:
  comments: false  # boolean type, the global switch for posts comments.
  shortname: 'sunyazhou13'    # Fill with your Disqus shortname. › https://help.disqus.com/en/articles/1717111-what-s-a-shortname

utterances:
  comments: false
  light_theme: github-light
  dark_theme: photon-dark
  repo: sunyazhou13/gitment-comments

# Giscus comments (https://giscus.app), based on GitHub Discussions.
# To enable:
#   1. Enable Discussions on the repo below
#   2. Install the giscus App: https://github.com/apps/giscus
#   3. Fill repo_id / category_id from https://giscus.app
#   4. Set comments to true (and set utterances.comments to false)
giscus:
  comments: true
  repo: sunyazhou13/sunyazhou13.github.io
  repo_id: 'MDEwOlJlcG9zaXRvcnkzODc1NTk1OA=='   # from https://giscus.app
  category: Announcements
  category_id: 'DIC_kwDOAk9eds4DDwpN'           # from https://giscus.app
  mapping: pathname
  light_theme: light
  dark_theme: dark_dimmed
  input_position: bottom
  reactions_enabled: 1

# Prefer color scheme setting, available values:
#
#     dual   - Follow the system prefer color by default, and a toggle will display
#              in the left bottom of Sidebar, which used for switch the theme between dark and light.
#
#     light  - Use the light color scheme
#
#     dark   - Use the dark color scheme
#
theme_mode: dual

# boolean type, global switch for ToC in posts.
toc: true

paginate: 10

plugins:
  - jekyll-tabs

markdown: kramdown

highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts: # Rouge Options › https://github.com/jneen/rouge#full-options
    css_class: 'highlight'
    # default_lang: console
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# DO NOT change this unless you're a Pro user on Jekyll and Web development,
# or you think you're smart enough to change other relevant URLs within this template.
permalink: /:year/:month/:title/

defaults:
  -
    scope:
      path: ""          # All pages (homepage, posts, tabs, etc.)
    values:
      image: /assets/images/avatar.jpg   # Default og:image for jekyll-seo-tag
  -
    scope:
      path: ""          # An empty string here means all files in the project
      type: posts
    values:
      layout: post
      comments: true    # Enable comments in posts.
      toc: true         # Display TOC column in posts.
      location: Post
      breadcrumb:
        -
          label: 主页
          url: /
  -
    scope:
      path: _drafts
    values:
      comments: false
  -
    scope:
      path: tags
    values:
      tab_active: Tags
      location: Tag
      breadcrumb:
        -
          label: 主页
          url: /
        -
          label: 标签
          url: /tabs/tags/
  -
    scope:
      path: categories
    values:
      tab_active: Categories
      location: Category
      breadcrumb:
        -
          label: 主页
          url: /
        -
          label: 分类
          url: /tabs/categories/
  -
    scope:
      path: tabs
    values:
      layout: page
      dynamic_title: true    # Hide title in mobile screens.
      breadcrumb:
        -
          label: 主页
          url: /


sass:
  sass_dir: /assets/css
  style: compressed
  quiet_deps: true
  silence_deprecations: ['import']

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: []

include:
  - .well-known    # Chrome DevTools 请求 /.well-known/appspecific/com.chrome.devtools.json

exclude:
  - vendor        # Avoid Jekyll mistakenly read the vendor directory on Travis-CI's VM .
  - Gemfile.lock
  - Gemfile
  - tools
  - docs
  - README.md
  - LICENSE

sitemap_exclude:  # Sitemap will exclude the following items.
  fuzzy:
    - /assets/
  accurate:
    - /norobots/
    - /tabs/
    - /categories/
    - /tags/
    - /posts/
    - /2011/
    - /2012/
    - /2013/
    - /2014/
    - /2015/
    - /2016/
    - /2017/
    - /2018/
    - /2019/
    - /2020/
    - /2021/
    - /2022/
    - /2023/
    - /2024/
    - /2025/
    - /2026/
    - /2027/
    - /2028/
    - /2029/
    - /2030/
    - 404.html
    - feed.xml
    - sitemap.xml
    - robots.txt
    - redirects.json
    - Brewfile
    - Brewfile.lock.json
    - build.sh
    - config.codekit3
