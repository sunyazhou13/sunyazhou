# 工具注册表
# 落地页 tabs/tools.md 按 category 分组渲染卡片，enabled: false 可单独下线某个工具
# 每个工具约定三处文件（全部互不依赖，可整体删除）：
#   - tools/<id>.md            工具页面
#   - assets/tools/<id>/       该工具全部静态资源（JS / CSS / WASM）
#   - 本文件中的一条注册记录

- id: image-to-avif
  title: 图片转 AVIF
  icon: fas fa-image
  description: PNG / JPEG / WebP / GIF 批量转 AVIF，动图逐帧转码保留动画，纯本地转换不上传（WASM libaom）
  path: /tools/image-to-avif/
  category: 图片与图像
  enabled: true

- id: color-picker
  title: 图片主色调提取
  icon: fas fa-palette
  description: 上传图片自动分析全部像素提取主色调，三种色彩量化算法（K-Means 聚类 / 中值切割 / 直方图统计）可选，颜色数量与采样精度可调，按占比输出 HEX + RGB 并生成 Swift / Objective-C / CSS / Android XML 代码片段，纯本地处理不上传
  path: /tools/color-picker/
  category: 图片与图像
  enabled: true

- id: color-converter
  title: 色彩格式转换
  icon: fas fa-palette
  description: HEX / RGB / HSL / SwiftUI / UIColor / Android / CSS 等色彩格式互转，实时联动、吸管取色、预设色板、一键复制，纯本地处理不上传
  path: /tools/color-converter/
  category: 图片与图像
  enabled: true

- id: webp-heic
  title: 图片格式转换
  icon: fas fa-exchange-alt
  description: PNG / JPEG / GIF / BMP / AVIF / HEIC 等互转 WebP / JPEG / PNG，纯本地转换不上传
  path: /tools/webp-heic/
  category: 图片与图像
  enabled: true

- id: qrcode
  title: 二维码生成解析
  icon: fas fa-qrcode
  description: 文本生成二维码图片（可选纠错级别、下载 PNG），上传二维码图片解析出文本/链接，纯本地处理不上传
  path: /tools/qrcode/
  category: 图片与图像
  enabled: true

- id: base64
  title: Base64 编码解码
  icon: fas fa-code
  description: 文本与 Base64 互转，支持标准与 URL 安全（Base64URL）变体，编码解码、一键复制，纯本地处理不上传
  path: /tools/base64/
  category: 编码转换
  enabled: true

- id: base-converter
  title: 进制转换
  icon: fas fa-calculator
  description: 二进制 / 八进制 / 十进制 / 十六进制实时联动互转，支持任意大整数，纯本地计算不上传
  path: /tools/base-converter/
  category: 编码转换
  enabled: true

- id: hash-string
  title: 字符串 Hash
  icon: fas fa-hashtag
  description: 输入字符串点击生成 MD5 / SHA1 / SHA256 / SHA384 / SHA512，支持大小写切换与一键复制，纯本地计算不上传
  path: /tools/hash-string/
  category: 编码转换
  enabled: true

- id: json-to-swift
  title: JSON → Swift 互转
  icon: fas fa-code
  description: 输入 JSON 生成 Swift Codable 结构体，或输入 Swift 生成示例 JSON。支持嵌套对象、蛇形命名、CodingKeys 自动生成，提供 Swift / Objective-C 双语言输出，纯本地处理不上传
  path: /tools/json-to-swift/
  category: 编码转换
  enabled: true

- id: 3d-viewer
  title: 3D 模型多视口分析
  icon: fas fa-cube
  description: 单渲染器四视口分析 3D 模型：线框看骨架、UV 棋盘格看皮囊、PBR 看光影、法线/深度看异常，四视口相机联动，支持 GLB/glTF/OBJ/FBX/STL/USDZ 加载与格式导出、点对点测距、截图标注，纯本地渲染不上传
  path: /tools/3d-viewer/
  category: 3D 模型
  enabled: true

- id: json-format
  title: JSON 工具
  icon: fas fa-file-code
  description: JSON 常用处理一条龙：树形浏览（展开/折叠、搜索、图片链接 hover 预览）、格式化/压缩/按键排序、宽容解析自动修复（尾逗号/单引号/无引号键/注释）、复制与下载 .json，错误定位行列，纯本地不上传
  path: /tools/json-format/
  category: 数据处理
  enabled: true

- id: timestamp
  title: 时间戳转换
  icon: fas fa-clock
  description: 实时显示当前日期时间精确到毫秒，Unix 时间戳与日期互转，优先兼容 Apple NSDate 带毫秒 Double 格式，自动识别秒/毫秒/小数时间戳，提供 Swift / Objective-C 时间戳 API 示例代码，纯本地不上传
  path: /tools/timestamp/
  category: 编码转换
  enabled: true

- id: xml-viewer
  path: /tools/xml-viewer/
  title: XML 工具
  icon: fas fa-code-branch
  description: XML 树形浏览、格式化、压缩、复制与下载
  category: 数据处理
  enabled: true

- id: exif-stripper
  title: 图片隐私脱敏器
  icon: fas fa-eye-slash
  description: 上传图片展示全部 EXIF 元数据（GPS 坐标、设备型号、拍摄时间等），一键抹除后下载，对比擦除前后文件大小与 metadata 占比，纯本地解析 JPEG/PNG 不上传
  path: /tools/exif-stripper/
  category: 图片与图像
  enabled: true

- id: grid-crop
  title: 九宫格切图
  icon: fas fa-th-large
  description: 上传图片按 3×3 切成 9 张，主体锚点保护自动调整网格避免人物被拦腰切断，支持平移微调，预览后打包下载全部 9 张，纯本地处理不上传
  path: /tools/grid-crop/
  category: 图片与图像
  enabled: true

- id: url-encode
  title: URL 编码解码
  icon: fas fa-link
  description: 文本与 URL 编码（%20%2F）互转，支持 encodeURIComponent 与 encodeURI 两种模式，双向一键互换、一键复制，纯本地处理不上传
  path: /tools/url-encode/
  category: 编码转换
  enabled: true

- id: jwt-parser
  title: JWT 在线解析器
  icon: fas fa-user-secret
  description: 粘贴 JWT 自动解码 Header 与 Payload 为 JSON 树，高亮过期时间并计算剩余天数，内置 HMAC-SHA256 签名校验、篡改演示，纯本地解析不上传
  path: /tools/jwt-parser/
  category: 编码转换
  enabled: true

- id: uuid-ulid
  title: UUID / ULID 生成器
  icon: fas fa-fingerprint
  description: 一键批量生成 1 / 10 / 100 个 UUID v4 与 ULID，支持复制单个或全部、换一批，纯本地生成不上传
  path: /tools/uuid-ulid/
  category: 编码转换
  enabled: true

- id: regex-tester
  title: 正则表达式测试器
  icon: fas fa-terminal
  description: 输入正则与测试文本实时高亮所有匹配项，展示捕获分组与匹配数量，提供回溯 / 复杂度监控并对灾难性回溯写法给出警示，纯本地计算不上传
  path: /tools/regex-tester/
  category: 编码转换
  enabled: true

- id: english-dictionary
  title: 英汉智能词典
  icon: fas fa-book
  description: 输入英文或中文自动识别语言查词翻译，内置 ECDICT 339 万词条本地词库（按首字母分片按需下载缓存到 IndexedDB 离线可用），在线 API 补充英文详细释义与例句，浏览器语音合成发音，纯本地不上传
  path: /tools/english-dictionary/
  category: 常用工具
  enabled: true

- id: lottie-viewer
  title: Lottie 动画预览器
  icon: fas fa-film
  description: 上传 Lottie JSON 或 dotLottie 文件预览动画，支持播放控制、进度拖拽、速度调节、循环切换、背景色切换、动画信息展示、导出当前帧 PNG，纯本地渲染不上传（lottie-web + JSZip）
  path: /tools/lottie-viewer/
  category: 图片与图像
  enabled: true

- id: pag-viewer
  title: PAG 动画预览器
  icon: fas fa-video
  description: 上传 PAG 文件预览动画，支持播放控制、进度拖拽、速度调节、循环切换、背景色切换、动画信息展示、导出当前帧 PNG，基于腾讯 libpag WASM 引擎，纯本地渲染不上传
  path: /tools/pag-viewer/
  category: 图片与图像
  enabled: true

- id: command-reference
  title: CocoaPods 速查手册
  icon: fas fa-terminal
  description: CocoaPods 命令与 Podspec DSL 速查参考，内置 111 条 CLI 命令与 DSL 方法的详细语法、参数说明、用法示例与注意事项，支持分类筛选与实时搜索，纯本地不上传
  path: /tools/command-reference/
  category: 开发文档
  enabled: true

- id: labor-arbitration
  title: 劳动仲裁助手
  icon: fas fa-gavel
  description: 被裁员后的维权一站式工具：12个月平均工资计算器、经济补偿金/赔偿金/年假工资/加班费估算、仲裁全流程指南、仲裁申请书一键生成模板。依据《劳动合同法》设计，纯本地不上传
  path: /tools/labor-arbitration/
  category: 生活助手
  enabled: true
